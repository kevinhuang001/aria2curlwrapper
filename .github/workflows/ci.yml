name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install aria2 and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 curl

      - name: Show the tools under test
        run: |
          aria2c --version | head -1
          curl --version | head -1

      - name: Install aria2curl
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        env:
          ARIA2CURL_TEST_ARIA2: aria2c
        run: python -m pytest -q

      - name: Check the environment end to end
        run: aria2curl doctor

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff==0.9.6

      - name: Ruff (correctness rules)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Shell syntax
        run: |
          for script in install.sh install-user.sh install-system.sh tools/aria2c tools/fetch-aria2.sh; do
            sh -n "$script"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck install.sh install-user.sh install-system.sh tools/aria2c tools/fetch-aria2.sh

  installer:
    name: user installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dry run
        run: sh install-user.sh --source . --prefix "$RUNNER_TEMP/prefix" --alias curl --yes --dry-run

      - name: Install from the checkout
        run: sh install-user.sh --source . --prefix "$RUNNER_TEMP/prefix" --alias curl --yes

      - name: The console scripts work
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          "$RUNNER_TEMP/prefix/bin/aria2curl" version
          "$RUNNER_TEMP/prefix/bin/acurl" config list --json > /dev/null
          "$RUNNER_TEMP/prefix/bin/aria2curl" config set split 8
          test "$("$RUNNER_TEMP/prefix/bin/aria2curl" config get split)" = "8"

      - name: The alias block was written
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          sh install-user.sh --source . --prefix "$RUNNER_TEMP/prefix" --alias curl --yes
          grep -q ">>> aria2curl >>>" "$HOME/.bashrc"
          grep -q "alias curl=" "$HOME/.bashrc"

      - name: Uninstall is clean
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          sh install-user.sh --prefix "$RUNNER_TEMP/prefix" --uninstall
          test ! -e "$RUNNER_TEMP/prefix/bin/aria2curl"
          ! grep -q ">>> aria2curl >>>" "$HOME/.bashrc"

  installer-system:
    name: system installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install aria2 and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 curl

      - name: Install machine wide with the curl shim
        run: sudo sh install-system.sh --source . --wrap-curl --with-aria2 --yes

      - name: The system layer is in place
        run: |
          aria2curl version
          aria2curl config path --system
          test -x /usr/local/bin/aria2curl
          test -x /usr/local/bin/acurl
          test -x /usr/local/bin/curl
          test -f /etc/profile.d/aria2curl.sh
          grep -q curl_path /etc/aria2curl/config.toml
          test "$(aria2curl config get curl_path --explain | awk '/source:/{print $2}')" = "system"

      - name: The shim is transparent for scripts
        run: |
          # `curl --version` must reach the real curl through the shim.
          PATH="/usr/local/bin:$PATH" curl -sS --version | head -1

          # A real download through the shim must be accelerated by aria2 and
          # must not recurse (a loop would hit the runner timeout instead).
          payload="$(mktemp -d)"
          head -c 400000 /dev/urandom > "$payload/blob.bin"
          python3 -m http.server 18099 --bind 127.0.0.1 --directory "$payload" &
          server=$!
          sleep 1
          cd "$RUNNER_TEMP"
          PATH="/usr/local/bin:$PATH" curl -sS -o blob.bin http://127.0.0.1:18099/blob.bin
          cmp "$payload/blob.bin" blob.bin

          # POST cannot be translated, so it must be served by the real curl.
          status="$(PATH="/usr/local/bin:$PATH" curl -sS -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/blob.bin)"
          test "$status" = "501"
          kill "$server"

      - name: Uninstall is clean
        run: |
          sudo sh install-system.sh --uninstall --purge
          test ! -e /usr/local/bin/curl
          test ! -e /usr/local/bin/aria2curl
          test ! -e /etc/profile.d/aria2curl.sh
          test ! -e /etc/aria2curl

  fallback:
    name: fallback without aria2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install curl only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl

      - name: Install aria2curl
        run: python -m pip install -e ".[dev]"

      - name: Everything must still work through plain curl
        run: python -m pytest -q tests/test_cli.py tests/test_config.py tests/test_curlparse.py tests/test_display.py tests/test_aria2args.py tests/test_exitcodes.py
